name: Feature request
description: A kit part, a figure kind, a paper source or a check you need
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to draw or check
      description: The figure or the failure behind the request.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
